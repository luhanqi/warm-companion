<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · 暖伴</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin />
    <link
      href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .top-links {
        display: none;
      }
      /* 页面不滚动：卡片在剩余空间里垂直水平居中；登录与注册卡片等高 */
      .login-shell {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }
      .login-card {
        width: 100%;
        max-width: 1200px;
        min-height: 560px;
        height: auto;
        background: #fffbf0;
        border: 1px solid #f0dfc4;
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(190, 118, 62, 0.2);
        display: grid;
        grid-template-columns: 1.05fr 1fr;
      }
      .login-illustration {
        background: linear-gradient(150deg, #fff3de 0%, #ffe7c4 48%, #ffd5a0 100%);
        position: relative;
        overflow: hidden;
      }
      .login-illustration .warm-scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
        display: block;
      }
      .login-form-side {
        padding: 34px 46px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 0;
      }
      .login-form-side .brand-title {
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: 28px;
        color: #8a4b2b;
        margin: 0 0 4px;
      }
      .login-form-side .brand-subtitle {
        color: #a97b58;
        margin: 0 0 20px;
        font-size: 14px;
      }
      .door-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }
      .door-card {
        border: 1px solid #edd9bc;
        background: #fdf5e7;
        border-radius: 14px;
        padding: 12px 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        min-height: 0;
      }
      .door-card:hover {
        border-color: #e7be92;
        background: #faebd2;
      }
      .door-card.on {
        border-color: #e8a05e;
        background: #fbecd7;
        box-shadow: 0 6px 16px rgba(232, 160, 94, 0.28);
      }
      .door-no {
        display: block;
        color: #b08a68;
        font-size: 13px;
        margin-bottom: 4px;
      }
      .door-card strong {
        color: #7a5438;
        font-size: 15px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        color: #8a6447;
        font-size: 14px;
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #ecd9bc;
        border-radius: 11px;
        background: #fdf5e7;
        padding: 11px 14px;
        font-size: 16px;
        color: #6b4a32;
        outline: none;
        transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        min-height: 0;
      }
      .field input:focus {
        border-color: #e89355;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(232, 147, 85, 0.18);
      }
      .solid-btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px;
        background: linear-gradient(135deg, #f7a55e 0%, #e6784b 100%);
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(230, 120, 75, 0.35);
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }
      .solid-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(230, 120, 75, 0.45);
      }
      .solid-btn:disabled {
        background: #e4c9a9;
        cursor: not-allowed;
        box-shadow: none;
      }
      .status-banner {
        margin-top: 10px;
        color: #c4523a;
        background: #fbe4dc;
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 14px;
      }
      .text-link-wrap {
        text-align: center;
        margin-top: 14px;
      }
      .text-link {
        color: #d0673c;
        font-size: 14px;
      }
      .login-form.panel {
        margin-top: 0;
        padding: 18px 20px;
        display: block;
        border-radius: 14px;
      }
      @media (max-width: 760px) {
        .login-card {
          grid-template-columns: 1fr;
          max-width: 480px;
          height: auto;
        }
        .login-illustration {
          min-height: 190px;
        }
        .login-form-side {
          padding: 22px 26px;
        }
        .login-form-side .brand-title {
          font-size: 24px;
        }
        .door-grid {
          margin-bottom: 12px;
        }
        .door-card {
          padding: 10px 10px;
        }
        .field {
          margin-bottom: 11px;
        }
      }
      @media (max-width: 760px) and (max-height: 720px) {
        .login-illustration {
          min-height: 130px;
        }
        .login-form-side {
          padding: 14px 22px;
        }
        .login-form-side .brand-subtitle {
          margin-bottom: 10px;
        }
        .door-card {
          padding: 8px 8px;
        }
        .door-card strong {
          font-size: 14px;
        }
        .field {
          margin-bottom: 8px;
        }
        .field input {
          padding: 8px 12px;
        }
        .solid-btn {
          padding: 10px;
          font-size: 15px;
        }
      }
      @media (max-height: 700px) and (min-width: 761px) {
        .login-shell {
          padding: 8px 14px;
        }
        .login-card {
          min-height: 0;
        }
        .login-form-side {
          padding: 14px 32px;
        }
        .login-form-side .brand-title {
          font-size: 24px;
        }
        .login-form-side .brand-subtitle {
          margin-bottom: 10px;
        }
        .door-grid {
          margin-bottom: 10px;
        }
        .door-card {
          padding: 8px 10px;
        }
        .login-form.panel {
          padding: 14px 16px;
        }
        .field {
          margin-bottom: 8px;
        }
        .field input {
          padding: 8px 12px;
        }
        .solid-btn {
          min-height: 0;
          padding: 10px;
        }
        .text-link-wrap {
          margin-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell public-shell">
      <header class="topbar" id="topbar"></header>
      <main class="page">
        <div class="login-shell">
          <div class="login-card">
            <div class="login-illustration" aria-hidden="true">
              <img class="warm-scene" src="images/warm-scene.png" alt="" />
            </div>
            <div class="login-form-side">
              <h1 class="brand-title">暖伴</h1>
              <p class="brand-subtitle">欢迎回来，请选择您的身份并登录</p>
              <div class="door-grid login-roles">
                <button type="button" class="door-card on" id="pick-elder">
                  <span class="door-no">老人</span>
                  <strong>老人登录</strong>
                </button>
                <button type="button" class="door-card" id="pick-family">
                  <span class="door-no">家人</span>
                  <strong>家人登录</strong>
                </button>
              </div>
              <form class="panel login-form" id="login-form">
                <label class="field">
                  账号
                  <input id="username" autocomplete="off" />
                </label>
                <label class="field">
                  口令
                  <input id="password" type="password" autocomplete="off" />
                </label>
                <button class="solid-btn landing-btn" type="submit" id="submit-btn">
                  进入暖伴
                </button>
                <div class="status-banner" id="error" hidden></div>
              </form>
              <div class="text-link-wrap">
                <a class="text-link" href="register.html" id="to-register">还没有账号？去注册</a>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer class="site-colophon">暖伴</footer>
    </div>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>
      NBLayout.publicTopbar("请先告诉我，您是哪一位");
      var loginParams = new URLSearchParams(location.search);
      var role = loginParams.get("role") === "family" ? "family" : "elder";
      NB.fetchMe()
        .then(function (data) {
          location.replace(data.role === "family" ? "family.html" : "talk.html");
        })
        .catch(function () {
          NB.writeAuth(null);
        });
      function friendlyError(error) {
        var msg = (error && error.message) || "";
        if (msg.indexOf("Failed to fetch") !== -1 || msg.indexOf("NetworkError") !== -1 || msg.indexOf("load failed") !== -1) {
          return "连不上暖伴服务，请确认后端已启动（127.0.0.1:8002）";
        }
        return msg || "没有登录上";
      }
      function paint() {
        document.getElementById("pick-elder").className = "door-card" + (role === "elder" ? " on" : "");
        document.getElementById("pick-family").className = "door-card" + (role === "family" ? " on" : "");
        document.getElementById("to-register").href = "register.html?role=" + role;
      }
      document.getElementById("pick-elder").onclick = function () {
        role = "elder";
        paint();
      };
      document.getElementById("pick-family").onclick = function () {
        role = "family";
        paint();
      };
      paint();
      if (loginParams.get("registered") === "1") {
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        var registeredNotice = document.getElementById("error");
        registeredNotice.hidden = false;
        registeredNotice.textContent = "注册成功，请使用新账号登录。";
      }
      document.getElementById("login-form").onsubmit = function (event) {
        event.preventDefault();
        var btn = document.getElementById("submit-btn");
        var err = document.getElementById("error");
        btn.disabled = true;
        btn.textContent = "正在进入…";
        err.hidden = true;
        NB.login(document.getElementById("username").value.trim(), document.getElementById("password").value)
          .then(function (session) {
            NB.writeAuth(session);
            location.replace(session.role === "family" ? "family.html" : "talk.html");
          })
          .catch(function (error) {
            err.hidden = false;
            err.textContent = friendlyError(error);
            btn.disabled = false;
            btn.textContent = "进入暖伴";
          });
      };
    </script>
  </body>
</html>
